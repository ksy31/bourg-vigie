<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Bourg-Vigie</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d50">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&display=swap">
<style>
:root{--bg:#f1efe9;--fg:#23282b;--mut:#5d676c;--card:#fff;--line:#cfcac0;--gold:#9a6a00;--btn:#2f5d50;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c1e;--fg:#e8e6df;--mut:#98a3a8;--card:#21282b;--line:#3a4448;--gold:#e2b43c;--btn:#6fb59d;--btnfg:#10201b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c1e;--fg:#e8e6df;--mut:#98a3a8;--card:#21282b;--line:#3a4448;--gold:#e2b43c;--btn:#6fb59d;--btnfg:#10201b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Alegreya,Georgia,serif}
main{max-width:480px;margin:0 auto;padding:10px}
h1{font-size:20px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:13px;color:var(--mut);font-weight:400}
.res{display:flex;gap:6px;margin-bottom:8px}
.res div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center;font-size:15px}
.res b{display:block;font-size:19px}
#g b{color:var(--gold)}
canvas{width:100%;display:block;border-radius:10px;border:1px solid var(--line);touch-action:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnfg);border:0;border-radius:8px;padding:9px 6px;min-height:44px}
button small{display:block;font-weight:400;font-size:12px;opacity:.9}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.spd{display:flex;gap:6px;margin-bottom:8px}
.spd button{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--line);min-height:36px;padding:4px}
.spd button.on{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn)}
#ros{display:grid;gap:5px;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 9px;font-size:14px}
.chip i{color:var(--mut);font-style:normal}
.chip.npc{border-color:#8e5bd6;background:rgba(142,91,214,.13)}
#log{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:15px;min-height:110px}
#log p{margin:2px 0}
#log .bad{color:#c0392b}
#log .ok{color:var(--btn)}
#bB{background:#9b2f2f;color:#fff}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#pv[hidden]{display:none}
#pv>div{background:var(--card);border-radius:12px;padding:14px;max-width:420px;width:100%}
#pu{display:grid;gap:6px;margin:10px 0}
.tab{display:none}.tab.on{display:block}
main{padding-bottom:76px}
#lb .chip{display:block;margin-bottom:5px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
#nav button{flex:1;background:none;color:var(--fg);border-radius:0;min-height:52px;font-size:11.5px;padding:4px 1px}
#nav button.on{color:var(--btn);box-shadow:inset 0 3px 0 var(--btn)}
#log{max-height:240px;overflow:auto}
html,body{touch-action:manipulation}
#toast{white-space:nowrap;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btnfg);padding:8px 14px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#toast.on{opacity:1}
#dv{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:6}
#dv[hidden]{display:none}
#dv>div{background:var(--card);border-radius:12px;padding:14px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
#dv textarea{width:100%;font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
#dv h3{margin:12px 0 6px;font-size:16px}
#dv button{margin:2px 2px 2px 0;padding:6px 10px;min-height:36px}
#mu{min-height:32px;padding:2px 10px;font-size:16px;background:var(--card);color:var(--fg);border:1px solid var(--line);flex:none}
</style>
</head>
<body>
<main>
<h1><span id="vt">Vigie</span> <small id="day"></small><button id="mu" aria-label="Musique">🔊</button></h1>
<div class="res"><div id="g"><b>0</b>or</div><div id="w"><b>0</b>bois</div><div id="s"><b>0</b>pierre</div></div>
<div class="tab on" id="tv"><canvas id="cv"></canvas>
<label style="display:block;margin:8px 0;font-size:15px"><input type="checkbox" id="tt"> Afficher le temps de trajet restant</label>
<div id="log"></div></div>
<div class="tab" id="tb"><div class="row">
<button id="bR"></button><button id="bH"></button>
<button id="bF"></button>
<button id="bT"></button><button id="bS"></button>
<button id="bM"></button><button id="bE"></button>
<button id="bB" style="grid-column:1/-1"></button>
</div></div>
<div class="tab" id="to">
<button id="sb">Sauvegarder</button> <button id="rb">Nouvelle partie</button> <small id="sv"></small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><button id="dg" aria-label="Développeur" style="min-height:30px;padding:2px 8px;background:none;color:var(--mut);border:1px solid var(--line);font-size:14px">⚙️</button><span style="color:var(--mut);font-size:12px">v2.7a</span></div></div>
<div class="tab" id="th"><div id="ros"></div></div>
<div class="tab" id="tl"><h3 style="margin:4px 0">Top 10 global (meilleur score par nom)</h3><div id="lb"></div></div>
</main>
<div id="dv" hidden><div><h2 style="margin:0 0 4px;font-size:20px">Développeur</h2>
<h3>Noms (un par ligne)</h3><textarea id="dn" rows="8"></textarea><small id="dc"></small><br>
<button id="dns">Enregistrer la liste</button><button id="dnr">Liste par défaut</button>
<h3>Sauvegarde</h3><textarea id="dt" rows="3" placeholder="Code de sauvegarde (export / import)"></textarea><br>
<button id="dex">Exporter</button><button id="dim">Importer</button>
<h3>Test</h3><button id="dr1">+500 or, bois, pierre</button>
<h3></h3><button id="dcl" style="width:100%">Fermer</button></div></div>
<div id="toast"></div>
<nav id="nav"><button class="on" data-t="tv">Carte</button><button data-t="tb">Bâtir</button><button data-t="th">Aventuriers</button><button data-t="tl">Top 10</button><button data-t="to">Options</button></nav>
<div id="pv" hidden><div><h2 id="pvt" style="margin:0 0 4px;font-size:20px"></h2><p id="pg" style="margin:0"></p><div id="pu"></div><input id="vn" maxlength="20" placeholder="Nom du village" style="width:100%;font:inherit;padding:9px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"><button id="pn" style="width:100%">Nouvelle run</button><button id="pc" hidden style="width:100%;margin-top:6px;background:var(--card);color:var(--fg);border:1px solid var(--line)">Annuler</button></div></div>
<script>
const CL={G:{n:'Guerrier',p:1.15,die:.4,g:1,r:1,cost:20,t:'Solide : survit mieux aux défaites.'},V:{n:'Voleur',p:.95,die:.5,g:1.4,r:1,cost:25,t:'Rapporte 40 % d’or en plus.'},M:{n:'Mage',p:1.3,die:.85,g:1,r:1,cost:30,t:'Très puissant, mais fragile.'},R:{n:'Rôdeur',p:1,die:.55,g:1,r:1.5,cost:22,t:'Rapporte 50 % de ressources en plus.'}};
const dz=z=>z.d*(1+Math.min(.75,(S.day-1)*.015));
const NE={A:'🛏️',F:'🔨',T:'🍺',S:'⛪',M:'🏪',E:'🐴',V:'🏛️'};
const NT={A:'Aubergiste',F:'Forgeron',T:'Tavernier',S:'Guérisseur',M:'Marchand',E:'Palefrenier',V:'Maire'};
const CI={G:'■',V:'▲',M:'◆',R:'⬢'};
const lbB=(a,b)=>a.k-b.k||a.g-b.g||a.lv-b.lv||a.d-b.d;
function lbAdd(e){if(!e||e.k==null||!e.eq)return;const j=P.lb.findIndex(x=>x.n===e.n);if(j<0)P.lb.push(e);else if(lbB(e,P.lb[j])>0)P.lb[j]=e;P.lb.sort((a,b)=>lbB(b,a));P.lb=P.lb.slice(0,10)}
const gn=x=>SL[x.c].filter(k=>x.eq[k]).map(k=>`${pn(x,k)} ${x.eq[k]}`).join(', ');
const BZ={n:'Trône du Roi',x:54,y:42,d:0,boss:1,c:'#5c1a1f'};
const ZB=[{n:'Forêt',d:4,c:'#4f7a46'},{n:'Mine',d:8,c:'#7b7f86'},{n:'Montagne',d:11,c:'#8f9bb0'},{n:'Ruines',d:13,c:'#8a6f55'},{n:'Donjon',d:20,c:'#5a3c63'},{n:'Volcan',d:26,c:'#b5452e'}];
const BASEPOS=[[20,76],[80,72],[88,44],[28,40],[70,16],[28,12]];
const ZV=[[['Clairière brumeuse',.75,'Renard enragé,Loup,Sanglier','Chouette spectrale,Loup noir,Ombre rôdeuse'],['Forêt profonde',1,'Loup,Bandit,Ours','Loup-garou,Dryade corrompue,Ombre sylvestre'],['Bois maudit',1.35,'Ours brun,Bandit de grand chemin,Esprit des bois','Loup-garou,Dryade corrompue,Arbre hanté']],
[['Carrière abandonnée',.75,'Gobelin,Rat géant,Araignée','Chauve-souris,Gobelin chaman,Ver rampant'],['Mine de fer',1,'Gobelin,Araignée géante,Golem de roche','Chauve-souris géante,Ver des profondeurs,Golem noir'],['Mine profonde',1.35,'Golem de roche,Troll,Basilic','Spectre de mineur,Troll des ombres,Ver colossal']],
[['Col venteux',.75,'Harpie,Bouquetin enragé,Loup des neiges','Aigle nocturne,Banshee,Loup spectral'],['Pic enneigé',1,'Yéti,Griffon,Harpie','Banshee,Wyverne,Yéti sombre'],['Cime des géants',1.35,'Griffon,Géant des pierres,Wyverne','Ogre lunaire,Wyverne,Géant des tempêtes']],
[['Ruines oubliées',.75,'Squelette,Brigand,Rat spectral','Fantôme,Cultiste,Ombre'],['Cité en ruine',1,'Squelette,Spectre,Gargouille','Fantôme,Cultiste,Armure hantée'],['Cryptes royales',1.35,'Nécromancien,Gargouille,Gardien momifié','Liche mineure,Armure hantée,Spectre royal']],
[['Cachots',.75,'Geôlier,Orc,Rat-garou','Succube,Spectre de prisonnier,Orc maudit'],['Donjon central',1,'Orc,Démon,Dragonnet','Succube,Chevalier maudit,Hydre'],['Citadelle noire',1.35,'Démon,Dragonnet,Seigneur liche','Chevalier maudit,Hydre,Archidémon']],
[['Pentes fumantes',.75,'Salamandre,Lézard de feu,Élémentaire de braise','Spectre ardent,Chimère,Salamandre noire'],['Cratère',1,'Salamandre,Golem de lave,Élémentaire de feu','Spectre ardent,Chimère,Drake nocturne'],['Cœur du volcan',1.35,'Golem de lave,Élémentaire de feu,Dragon ancien','Drake nocturne,Titan de cendre,Dragon des cendres']]];
let Z=[],ZA=[];
function layout(){const out=[];BASEPOS.forEach(b=>{let p=null;for(let k=0;k<40&&!p;k++){const a=(Math.random()*2-1)*.25,c=Math.cos(a),s=Math.sin(a),vx=b[0]-T.x,vy=b[1]-T.y,q=[Math.min(86,Math.max(14,T.x+vx*c-vy*s)),Math.min(76,Math.max(16,T.y+vx*s+vy*c))];if(out.every(o=>Math.hypot(o[0]-q[0],o[1]-q[1])>20)&&Math.hypot(q[0]-BZ.x,q[1]-BZ.y)>20)p=q}out.push(p||b.slice())});return out}
function buildZ(){Z=ZB.map((b,i)=>{const v=ZV[i][S.zv[i]];return{n:b.n,sn:v[0],x:S.zp[i][0],y:S.zp[i][1],d:Math.round(b.d*v[1]),c:b.c,e:v[2].split(',').map((m,j)=>[m,[.8,1.1,1.5][j]]),f:v[3].split(',').map((m,j)=>[m,[.9,1.2,1.6][j]])}});ZA=[...Z,BZ]}
let P={glory:0,runs:0,g:0,p:0,s:0,h:0,lb:[]};
try{Object.assign(P,JSON.parse(localStorage.getItem('bv')||'{}'))}catch(e){}
P.lb=(P.lb||[]).filter(x=>x&&x.eq&&x.k!=null);
const save=()=>{try{localStorage.setItem('bv',JSON.stringify(P))}catch(e){}};
const U={g:{n:'Fortune',t:'+15 % d’or'},p:{n:'Vaillance',t:'+6 % de puissance'},s:{n:'Héritage',t:'+40 or au départ'},h:{n:'Vigueur',t:'−8 % de repos'}};
const bossD=()=>100*(1+.35*P.runs);
const spd=(q,h)=>{const D=Math.hypot(q.x-h.x,q.y-h.y);return D/(60+Math.max(0,D-38)*4.1)};
const BD={
 E:{n:'Écurie',t:'+1 cheval',k:'stable',c:l=>({w:35+l*30,s:15+l*15,g:50+l*60})},
 H:{n:'Maison',t:'+1 place, à vendre',k:'houses',c:l=>({w:20+l*15,s:8+l*8,g:0})},
 F:{n:'Forge',t:'+puissance',k:'forge',c:l=>({w:25+l*25,s:25+l*25,g:30+l*40})},
 T:{n:'Taverne',t:'repos −12 %',k:'tavern',c:l=>({w:30+l*25,s:10+l*12,g:40+l*50})},
 S:{n:'Sanctuaire',t:'morts −8 %',k:'spa',c:l=>({w:20+l*20,s:30+l*25,g:60+l*70})},
 M:{n:'Marché',t:'or +10 %',k:'market',c:l=>({w:40+l*30,s:20+l*20,g:50+l*60})}};
const cs=c=>[c.w&&c.w+' bois',c.s&&c.s+' pierre',c.g&&c.g+' or'].filter(Boolean).join(', ');
const bestRest=()=>S.hero.filter(h=>h.st==='rest').sort((a,b)=>power(b)-power(a))[0];
function sendBoss(){const h=bestRest();if(!h)return;leave(h,BZ);log(`${h.name} part affronter le Roi Démon…`,'bad');ui()}
function victory(h){
 const gain=2+Math.floor(S.hero.length/3);
 P.glory+=gain;P.runs++;save();S.speed=0;
 $('pvt').textContent=`${h.name} a terrassé le Roi Démon ! +${gain} Gloire`;
 shop();$('pn').textContent='Nouvelle run';$('vn').value=S.vn;$('pc').hidden=true;$('pv').hidden=false;
}
function shop(){
 $('pg').textContent=`Gloire : ${P.glory} · bonus permanents`;
 $('pu').innerHTML=Object.entries(U).map(([k,u])=>`<button data-u="${k}" ${P.glory<P[k]+1?'disabled':''}>${u.n} (niv. ${P[k]})<small>${u.t} · ${P[k]+1} Gloire</small></button>`).join('');
 $('pu').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.u;if(P.glory>=P[k]+1){P.glory-=P[k]+1;P[k]++;save();shop()}});
}
function newRun(){
 clearInterval(gameOver.t);S=fresh();buildZ();S.vn=($('vn').value.trim()||'Vigie').slice(0,20);logs=[];$('pn').textContent='Nouvelle run';$('pc').hidden=true;$('pv').hidden=true;
  ui();log('Nouvelle partie : recrute tes premiers aventuriers, ils partiront seuls en quête.','ok');
}
const T={x:50,y:102};
let NAMES=['KaoTiem', 'Nathalie', 'Lilian', 'Lena', 'Anne', 'Chani', 'Momo', 'NayTiem', 'David', 'Julie', 'Didier', 'Karine', 'Julien-F', 'SanTiem', 'Marie-Laure', 'Karian', 'Marine', 'Cléo', 'Alicia', 'Liam', 'SouTiem', 'Jenny', 'Tommy', 'Willy', 'Meily', 'Claude', 'Cécile', 'Claire', 'Laure', 'KaoTon', 'Ludivine', 'Axel', 'Aurore', 'Ambre', 'SainPou', 'Mike', 'Sébastien', 'KaoPou', 'Carla', 'Loann', 'Enzo', 'Noëlla', 'NayPou', 'Christel', 'Maëlys', 'Thibault', 'FamPou', 'Alexandre', 'Lucas', 'Patrick', 'SouPou', 'Leila', 'Lay', 'Arnaud', 'Léa', 'Khe', 'Carlos', 'Mélinda', 'Nathan', 'Ou', 'MeyTsoy', 'NayTsoy', 'Mathieu', 'Emy', 'Élodie', 'Tristan', 'Fred', 'Pa', 'Raphaëlle', 'Camille', 'Julien', 'Sy', 'Émilie', 'Inès', 'Arthur', 'José', 'Angélique', 'Laurie', 'Eva', 'Lucas-G', 'Maël', 'Clara', 'Naomie', 'Baptiste', 'Chloé', 'Marvin'];
const NAMES0=NAMES.slice();
try{const j=JSON.parse(localStorage.getItem('bvn')||'null');if(Array.isArray(j))NAMES=j.filter(x=>typeof x==='string')}catch(e){}
const SYL=['ka','ro','mi','el','dan','vi','tor','la','ny','sa','bre','gor','ai','lun','mar','thy','ze','fen','ori','ca','dra','lis','mon','tha'];
const fmt=s=>s.replace(/\u2060([^\u2061]*)\u2061/g,'<i>$1</i>'),sn=s=>s.replace(/[\u2060\u2061]/g,'');
function rn(ex,st){const used=new Set(ex);if(st){st.hero.forEach(q=>used.add(q.name));Object.values(st.npc||{}).forEach(x=>used.add(x.n))}
 const f=NAMES.filter(n=>!used.has(n));if(f.length)return f[Math.floor(Math.random()*f.length)];
 for(let k=0;k<60;k++){let s='';const n=2+Math.floor(Math.random()*2);for(let i=0;i<n;i++)s+=SYL[Math.floor(Math.random()*SYL.length)];s=s[0].toUpperCase()+s.slice(1);const m='\u2060'+s+'\u2061';if(!used.has(m)&&!NAMES.includes(s))return m}
 return '\u2060Anonyme'+Math.floor(Math.random()*1e4)+'\u2061'}
function ui(){ui0();$('ros').innerHTML=fmt($('ros').innerHTML);$('lb').innerHTML=fmt($('lb').innerHTML)}
function exportCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,S:Object.assign({},S,{logs:logs.slice(0,20)}),P,N:NAMES}))))}
function importCode(c){const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!o||!o.S||!Array.isArray(o.S.hero)||!Array.isArray(o.S.pl))throw 0;localStorage.setItem(SK,JSON.stringify(o.S));if(o.P)localStorage.setItem('bv',JSON.stringify(o.P));if(Array.isArray(o.N))localStorage.setItem('bvn',JSON.stringify(o.N))}
const COL=['#e07a5f','#f2cc8f','#81b29a','#8ecae6','#c8a2c8','#f4a261','#a7c957','#ff9fb2'];
const fresh=()=>({g:48+40*P.s,w:0,s:0,houses:0,forge:0,tavern:0,spa:0,market:0,hero:[],t:0,day:1,speed:1,n:0,marks:[],alert:null,inn:1,stable:0,hs:[],horses:[],vn:'Vigie',lb:[],zv:ZB.map(()=>Math.floor(Math.random()*3)),zp:layout(),ds:0,dl:900,pl:[{e:NE.A,i:0},{e:NE.V,i:1}],npc:(()=>{const a=rn([]),b=rn([a]);return{A:{n:a,lv:1,xp:0},V:{n:b,lv:1,xp:0}}})()});
let S=fresh(),showT=false;
const rname=()=>rn([],S);
const rem=h=>{if(h.st==='fight')return h.t;if(h.st!=='go'&&h.st!=='back')return 0;const tg=h.st==='go'?h.pt:base(h);return Math.hypot(tg.x-h.x,tg.y-h.y)/(h.v*spf(h))};

const nl=k=>S.npc[k]?S.npc[k].lv:0;
const hr=()=>Math.floor((6+24*(S.t-S.ds)/S.dl)%24);
const isNight=()=>{const x=hr();return x>=21||x<4};
const dk=()=>{const x=(6+24*(S.t-S.ds)/S.dl)%24;if(x>=21||x<4)return 1;if(x>=20)return x-20;if(x<5)return 5-x;return 0};
function gameOver(){S.over=1;S.speed=0;let n=10;const t=()=>{$('pvt').textContent=n>0?'You lose':'Game Over';$('pg').textContent=n>0?`Continue ? ${n}`:'Fin de partie.';$('pn').textContent=n>0?'Continue':'Recommencer'};t();$('pu').innerHTML=`<p style="margin:0">Tu as tenu ${S.day} jours.</p>`;$('vn').value=S.vn;$('pc').hidden=true;$('pv').hidden=false;clearInterval(gameOver.t);gameOver.t=setInterval(()=>{if(--n<=0)clearInterval(gameOver.t);t()},1000)}
