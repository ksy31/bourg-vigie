<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>KSVillage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d50">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KSVillage">
<style>#ld{position:fixed;inset:0;z-index:9999;background:#171c1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#e8e6df;font-family:Alegreya,Georgia,serif;transition:opacity .35s}#ld img{width:120px;height:120px;border-radius:24px;image-rendering:pixelated}#ld b{font-size:30px;letter-spacing:1px}#ld small{color:#98a3a8;font-size:15px}.ldb{width:170px;height:6px;background:#2a3236;border-radius:3px;overflow:hidden}.ldb i{display:block;width:40%;height:100%;background:#e2b43c;border-radius:3px;animation:ldm 1.1s ease-in-out infinite}@keyframes ldm{0%{margin-left:-40%}100%{margin-left:100%}}</style>
<script>window.dip=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.dip=e;var b=document.getElementById('inst');if(b)b.hidden=false});addEventListener('appinstalled',function(){window.dip=null;var b=document.getElementById('inst');if(b)b.hidden=true});window.ldHide=function(){var e=document.getElementById('ld');if(!e||e.dataset.h)return;e.dataset.h=1;setTimeout(function(){e.style.opacity=0;setTimeout(function(){e.remove()},400)},Math.max(0,600-performance.now()))};setTimeout(window.ldHide,10000)</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><b>KSVillage</b><div class="ldb"><i></i></div><small>Chargement en cours…</small></div>
<main>
<div id="hb"><h1><span id="vt">Vigie</span> <small id="day"></small></h1>
<div id="rl"></div></div>
<div class="tab on" id="tv"><canvas id="cv"></canvas><button id="slp" aria-label="Mode veille (écran noir)" title="Mode veille">🌑</button>
<div id="fb"><label><input type="checkbox" id="tt"> Afficher le temps de trajet restant</label><button id="fp" aria-label="Aventurier précédent">◀</button><button id="fn" aria-label="Aventurier suivant">▶</button></div>
<div id="log"></div></div>
<div class="tab" id="tb"><div class="res"><div id="g"><b>0</b>or</div><div id="w"><b>0</b>bois</div><div id="s"><b>0</b>pierre</div></div><div class="row">
<button id="bR"></button><button id="bH"></button>
<button id="bF"></button>
<button id="bT"></button><button id="bS"></button>
<button id="bE"></button>
<button id="bI"></button>
<button id="bC"></button>
<button id="bN"></button>
<button id="bB" style="grid-column:1/-1"></button>
</div></div>
<div class="tab" id="to">
<div><button id="mu" aria-label="Musique" title="Musique"></button> <button id="am" aria-label="Ambiances sonores" title="Ambiances sonores"></button> <button id="thm" aria-label="Thème Jour/Nuit" title="Thème Jour/Nuit"></button> <button id="fsb" aria-label="Plein écran" title="Plein écran"></button> <button id="r3" aria-label="Rendu 2D ou 3D" title="Rendu 2D ou 3D"></button> <button id="qb" aria-label="Qualité 3D" title="Qualité 3D"></button> <button id="fpb" aria-label="Images par seconde" title="Images par seconde"></button></div>
<div id="ob"><button id="inst" hidden>📲 Installer l’application</button> <button id="sb">Sauvegarder</button> <button id="rb">Nouvelle partie</button><br><small id="sv"></small></div><div id="ov"><button id="dg" aria-label="Développeur" style="min-height:30px;padding:2px 8px;background:none;color:var(--mut);border:1px solid var(--line);font-size:14px">⚙️</button><span style="color:var(--mut);font-size:12px">v3.9.5</span></div></div>
<div class="tab" id="th"><div id="ros"></div></div>
<div class="tab" id="tl"><div id="lbs"><button class="on" data-l="a">Aventuriers</button><button data-l="v">Villages</button></div><h3 id="lbt" style="margin:4px 0">Top 10 global (meilleur score par nom)</h3><div id="lb"></div><div id="lbv" hidden></div></div>
</main>
<div id="dv" hidden><div><h2 style="margin:0 0 4px;font-size:20px">Développeur</h2>
<button id="dfps">Compteur fps (3D) : non</button>
<h3>Noms (un par ligne)</h3><textarea id="dn" rows="8"></textarea><small id="dc"></small><br>
<button id="dns">Enregistrer la liste</button><button id="dnr">Liste par défaut</button>
<h3>Genre des prénoms</h3><small>— = au hasard</small><div id="dgl"></div>
<h3>Sauvegarde</h3><textarea id="dt" rows="3" placeholder="Code de sauvegarde (export / import)"></textarea><br>
<button id="dex">Exporter</button><button id="dim">Importer</button>
<h3>Classement et réinitialisation</h3><button id="dlb">Réinitialiser le Top 10</button> <button id="dfr">Réinitialisation complète</button>
<h3>Test</h3><button id="dr1">+500 or, bois, pierre</button>
<h3></h3><button id="dcl" style="width:100%">Fermer</button></div></div>
<div id="sl" hidden><span id="slt">Touche pour réveiller</span></div>
<div id="toast"></div>
<nav id="nav"><button class="on" data-t="tv">Carte</button><button data-t="tb">Bâtir</button><button data-t="th">Aventuriers</button><button data-t="tl">Top 10</button><button data-t="to">Options</button></nav>
<div id="pv" hidden><div><h2 id="pvt" style="margin:0 0 4px;font-size:20px"></h2><p id="pg" style="margin:0"></p><div id="pu"></div><input id="vn" maxlength="20" placeholder="Nom du village" style="width:100%;font:inherit;padding:9px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"><button id="pn" style="width:100%">Nouvelle run</button><button id="pc" hidden style="width:100%;margin-top:6px;background:var(--card);color:var(--fg);border:1px solid var(--line)">Annuler</button></div></div>
<!-- L'ordre de chargement est important : les fichiers partagent la même portée globale. -->
<script src="data.js"></script>
<script src="state.js"></script>
<script src="village.js"></script>
<script src="save.js"></script>
<script src="combat.js"></script>
<script src="classes.js"></script>
<script src="ui.js"></script>
<script src="three.min.js"></script>
<script src="map.js"></script>
<script src="monsters.js"></script>
<script src="gl.js"></script>
<script src="audio.js"></script>
<script src="dev.js"></script>
<script src="main.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body>
</html>
